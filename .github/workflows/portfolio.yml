name: Portfolio CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project files
        run: ls -la

      - name: Check index.html
        run: test -f index.html

      - name: CI completed
        run: echo "Portfolio CI completed successfully!"